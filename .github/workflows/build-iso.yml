name: Build Jupiter ISO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build live ISO (Fedora 44)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # livemedia-creator needs root, loop devices and mounts inside the build.
    container:
      image: fedora:44
      options: --privileged
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          dnf install -y lorax-lmc-novirt pykickstart coreutils sed \
            python3 util-linux

      - name: Unit tests
        run: python3 -m unittest tests/test_installer.py -v

      - name: Installer dry run
        run: python3 installer/jupiter-installer.py --dry-run --no-tui

      - name: Build ISO
        run: |
          set -o pipefail
          ./build/build-iso.sh 2>&1 | tee build-iso.log

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jupiter-fedora44-x86_64
          path: build/out/*.iso
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-iso.log
            build/out/**/*.log
          if-no-files-found: ignore
